<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<style>
  :root{color-scheme:light dark}
  body{width:320px;margin:0;padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:#fff;color:#111827}
  h1{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
  .logo{width:22px;height:22px;border-radius:6px;background:#1D4ED8;color:#fff;font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center}
  p.sub{margin:0 0 14px;font-size:12px;color:#6b7280}
  label{display:block;font-size:12px;font-weight:600;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;
    font:inherit;font-size:13px;background:#fff;color:inherit}
  button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:8px;background:#1D4ED8;color:#fff;
    font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:#1e40af}
  button.ghost{background:#f1f5f9;color:#334155}
  .msg{margin-top:12px;padding:9px 11px;border-radius:8px;font-size:12px;display:none}
  .msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
  .msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .stat{padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;font-size:12.5px}
  .stat b{font-size:16px;display:block}
  details{margin-top:14px;font-size:12px;color:#6b7280}
  summary{cursor:pointer}
  a{color:#1D4ED8}
  @media (prefers-color-scheme: dark){
    body{background:#0f172a;color:#e2e8f0}
    input{background:#0f172a;color:#e2e8f0;border-color:#334155}
    .stat{background:#111c33;border-color:#1e293b}
    button.ghost{background:#1e293b;color:#cbd5e1}
    p.sub,details{color:#94a3b8}
  }
</style>
</head>
<body>
  <h1><span class="logo">L</span> LeadEnricher</h1>
  <p class="sub">Contatos B2B direto no LinkedIn</p>

  <div id="paired" style="display:none">
    <div class="stat">
      <b>Conectado</b>
      <span>abra um perfil ou uma página de empresa no LinkedIn</span>
    </div>
    <p class="sub" id="fontes" style="margin-top:10px"></p>
    <button class="ghost" id="unpair">Desconectar este navegador</button>
  </div>

  <div id="unpaired">
    <p class="sub">
      No LeadEnricher, vá em <strong>Configurações → Extensão</strong> e gere um código.
      Cole aqui para conectar este navegador.
    </p>
    <label for="code">Código de pareamento</label>
    <input id="code" placeholder="ABCD-EF12" autocomplete="off"/>
    <button id="pair">Conectar</button>
    <details>
      <summary>Estou rodando o app localmente</summary>
      <label for="api">Endereço da API</label>
      <input id="api" placeholder="http://localhost:8000"/>
    </details>
  </div>

  <div class="msg" id="msg"></div>
  <p class="sub" style="margin-top:14px">
    <a href="https://leadenricher.app/app" target="_blank">Abrir o app</a> ·
    <a href="https://leadenricher.app/remover-meus-dados" target="_blank">Remover meus dados</a>
  </p>

  <script src="popup.js"></script>
</body>
</html>
