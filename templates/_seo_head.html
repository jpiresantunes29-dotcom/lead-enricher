{# Bloco de SEO comum a todas as páginas — dados vêm de services/seo.py #}
  <title>{{ seo.title }}</title>
  <meta name="description" content="{{ seo.description }}" />
  <link rel="canonical" href="{{ seo.canonical }}" />
{%- if seo.indexable %}
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
{%- else %}
  <meta name="robots" content="noindex, nofollow" />
{%- endif %}
  <meta name="theme-color" content="{{ seo.theme_color }}" />
  <meta name="author" content="{{ seo.site_name }}" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ seo.site_name }}" />
  <meta property="og:locale" content="{{ seo.locale }}" />
  <meta property="og:url" content="{{ seo.canonical }}" />
  <meta property="og:title" content="{{ seo.og_title }}" />
  <meta property="og:description" content="{{ seo.description }}" />
  <meta property="og:image" content="{{ seo.image }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ seo.image_alt }}" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ seo.og_title }}" />
  <meta name="twitter:description" content="{{ seo.description }}" />
  <meta name="twitter:image" content="{{ seo.image }}" />
  <meta name="twitter:image:alt" content="{{ seo.image_alt }}" />
{% for block in seo.json_ld %}
  <script type="application/ld+json">{{ block | tojson }}</script>
{%- endfor %}
